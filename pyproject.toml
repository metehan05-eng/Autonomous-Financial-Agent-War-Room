# Tooling configuration for the Autonomous Financial Agent War Room.
#
# The runtime dependencies live in requirements.txt; this file only holds
# shared configuration for ruff, pytest and mypy so that lint/type/test runs
# are reproducible on any machine.

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "SIM", "UP", "RUF"]
ignore = [
    "E501",   # long lines are common in prompts/docstrings
    "RUF001", # ambiguous unicode characters (emoji are intentional)
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = false
warn_unused_ignores = false
